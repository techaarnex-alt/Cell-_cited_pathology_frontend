<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)" />

  <!-- Subtle medical cross backdrop -->
  <g opacity="0.08" fill="#ffffff">
    <rect x="82" y="25" width="36" height="150" rx="10" />
    <rect x="25" y="82" width="150" height="36" rx="10" />
  </g>

  <!-- Body / White Doctor Coat -->
  <path d="M38 185 C38 142 62 128 100 128 C138 128 162 142 162 185 Z" fill="url(#coat)" filter="url(#shadow)" />
  
  <!-- Tie / Shirt Collar -->
  <path d="M88 128 L100 148 L112 128 Z" fill="#0284c7" />
  <path d="M96 148 L104 148 L102 180 L98 180 Z" fill="#0284c7" />
  <path d="M84 128 L100 152 L94 185 L38 185 C38 150 58 132 84 128 Z" fill="#ffffff" />
  <path d="M116 128 L100 152 L106 185 L162 185 C162 150 142 132 116 128 Z" fill="#f8fafc" />

  <!-- Stethoscope -->
  <path d="M72 134 C72 160 82 174 100 174 C118 174 128 160 128 134" fill="none" stroke="#64748b" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="100" cy="178" r="6" fill="#94a3b8" stroke="#475569" stroke-width="2" />

  <!-- Neck -->
  <rect x="88" y="104" width="24" height="28" rx="6" fill="#fed7aa" />

  <!-- Head -->
  <ellipse cx="100" cy="78" rx="30" ry="34" fill="#ffedd5" filter="url(#shadow)" />

  <!-- Hair -->
  <path d="M70 72 C68 50 82 40 100 40 C118 40 132 50 130 72 C125 56 115 50 100 50 C85 50 75 56 70 72 Z" fill="#1e293b" />
  <path d="M69 70 Q67 82 72 88 Q74 74 72 70 Z" fill="#1e293b" />
  <path d="M131 70 Q133 82 128 88 Q126 74 128 70 Z" fill="#1e293b" />

  <!-- Eyes & Eyebrows -->
  <ellipse cx="88" cy="76" rx="3.5" ry="4" fill="#0f172a" />
  <ellipse cx="112" cy="76" rx="3.5" ry="4" fill="#0f172a" />
  <path d="M83 69 Q88 66 93 69" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <path d="M107 69 Q112 66 117 69" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

  <!-- Glasses -->
  <rect x="81" y="70" width="15" height="13" rx="3" fill="none" stroke="#0284c7" stroke-width="2" />
  <rect x="104" y="70" width="15" height="13" rx="3" fill="none" stroke="#0284c7" stroke-width="2" />
  <line x1="96" y1="75" x2="104" y2="75" stroke="#0284c7" stroke-width="2" />
  <line x1="81" y1="74" x2="72" y2="73" stroke="#0284c7" stroke-width="1.8" />
  <line x1="119" y1="74" x2="128" y2="73" stroke="#0284c7" stroke-width="1.8" />

  <!-- Smile -->
  <path d="M93 92 Q100 98 107 92" fill="none" stroke="#b45309" stroke-width="2.2" stroke-linecap="round" />
</svg>
